<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fdcff">
<title>ぽけっとタウン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="places"></div>
  <div class="tools">
    <button id="btnAdd" title="あたらしい子">＋👧</button>
    <button id="btnNight" title="ひる/よる">☀️</button>
    <button id="btnSound" title="おと">🔊</button>
    <button id="btnReset" title="さいしょから">↺</button>
  </div>
</div>
<div id="toast"></div>

<div id="editor" class="hidden">
  <div class="panel">
    <canvas id="preview" width="240" height="280"></canvas>
    <div id="rows"></div>
    <div class="actions">
      <button id="edRandom">🎲 おまかせ</button>
      <button id="edDelete">👋 バイバイ</button>
      <button id="edOk" class="ok">OK</button>
    </div>
  </div>
</div>

<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
